packages:
  - playground
autoInstallPeers: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest: 5.0.1
  vite-plus: 1.0.0
  "@vitest/coverage-v8": 5.0.1
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  "@google/genai": false
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false
minimumReleaseAgeExclude:
  - "@agntn/*"

# Stops pnpm 12 from opening the lockfile with an env document, which GitHub reads as zero dependencies.
pmOnFail: ignore
