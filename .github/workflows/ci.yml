name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: 26
          cache: true
      - run: pnpm lint
      - run: pnpm test:types
      - run: pnpm --dir playground build
      - run: pnpm exec vp test run --coverage
      - uses: codecov/codecov-action@v5
