name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs docs/ too: test/docs-mcp.test.ts loads the /mcp helper and its toolkit from there.
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: 26
          cache: true
          run-install: |
            - cwd: .
              args: ['--frozen-lockfile']
            - cwd: docs
              args: ['--frozen-lockfile']
      - run: pnpm lint
      - run: pnpm test:types
      - run: pnpm --dir playground build
      - run: pnpm exec vp test run --coverage
      - uses: codecov/codecov-action@v5
