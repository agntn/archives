name: release

on:
  push:
    # release/v* picks up hand edits to an open release PR
    branches: [main, "release/v*"]
  pull_request:
    types: [closed]
    branches: [main]
  # merged release PRs, publish reruns and prereleases all arrive here
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Cut a prerelease instead of a normal release, e.g. `beta`, `rc`, or `0`"
        required: false
        default: ""
      npm-tag:
        description: "npm dist-tag to publish to. Set by uppt/release for maintenance lines; leave blank otherwise"
        required: false
        default: ""

permissions: {}

jobs:
  # open or update a draft release PR from conventional commits
  pr:
    if: |
      !github.event.repository.fork
      && (
        (
          github.event_name == 'push'
          && (
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
            || startsWith(github.ref, 'refs/heads/release/v')
          )
        ) || (
          github.event_name == 'workflow_dispatch'
          && !startsWith(github.ref, 'refs/tags/')
        )
      )
    runs-on: ubuntu-latest
    # a newer push recomputes the bump anyway, so the older run can go
    concurrency:
      group: release-pr
      cancel-in-progress: true
    permissions:
      contents: write # push release/vX.Y.Z and delete superseded branches
      pull-requests: write # open, update and close release PRs
    steps:
      - uses: danielroe/uppt/pr@6ec27140623aa835e362f866d8ab0018ab057f4d # v0.6.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ inputs.prerelease }}

  # release PR merged: tag it, cut a GitHub release, dispatch the publish run
  release:
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release/v')
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.repository.fork
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write # push the vX.Y.Z tag and cut the GitHub release
      actions: write # dispatch the publish run on that tag
    steps:
      - uses: danielroe/uppt/release@6ec27140623aa835e362f866d8ab0018ab057f4d # v0.6.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # the full suite on the tag itself, on its own runner so pack stays scriptless
  test:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs docs/ too: test/docs-mcp.test.ts loads the /mcp helper and its toolkit from there.
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: v26.12.0
          run-install: |
            - cwd: .
              args: ['--frozen-lockfile']
            - cwd: docs
              args: ['--frozen-lockfile']
      - run: pnpm test

  # the chained dispatch lands here on the vX.Y.Z tag; build the tarball
  pack:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: pack-${{ github.ref }}
      cancel-in-progress: false
    permissions: {}
    outputs:
      files: ${{ steps.pack.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uppt installs through corepack, which Node 26 no longer ships, and the package needs Node 26.
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: v26.12.0
          run-install: |
            - cwd: .
              args: ['--frozen-lockfile', '--ignore-scripts']
      - id: pack
        uses: danielroe/uppt/pack@6ec27140623aa835e362f866d8ab0018ab057f4d # v0.6.11
        with:
          checkout: false
          install: false

  # stage the prebuilt tarball to npm via OIDC
  publish:
    if: |
      github.event_name == 'workflow_dispatch'
      && startsWith(github.ref, 'refs/tags/v')
      && needs.pack.outputs.files != '[]'
    needs: pack
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write # OIDC claim for the npm trusted publisher
    environment: npm # must match the trusted publisher entry on npmjs.com
    steps:
      - uses: danielroe/uppt/publish@6ec27140623aa835e362f866d8ab0018ab057f4d # v0.6.11
        with:
          files: ${{ needs.pack.outputs.files }}
          npm-tag: ${{ inputs.npm-tag }}
