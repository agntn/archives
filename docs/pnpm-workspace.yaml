packages:
  - .

# Without it docs/node_modules holds only direct dependencies, Node walks up to the root
# node_modules, and SSR gets a second copy of Vue: `Cannot read properties of null (reading 'ce')`.
shamefullyHoist: true

allowBuilds:
  better-sqlite3: true
  esbuild: true
  workerd: true
  vue-demi: true
  core-js-pure: false

minimumReleaseAgeExclude:
  - webmcp-types@0.1.6
  - '@agntn/*'

# Stops pnpm 12 from opening the lockfile with an env document, which GitHub reads as zero dependencies.
pmOnFail: ignore
